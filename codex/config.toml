# Codex keybinding reference.
# `make codex` appends this commented block to the local config without
# changing active settings. Uncomment only the bindings you want to use.
# If the local config already has a section, add the key there instead of
# uncommenting a duplicate section header.

[tui.keymap.composer]
submit = "alt-enter"
# queue = "tab" # Queue a message while Codex is working.
# toggle_shortcuts = ["?", "shift-?"] # Show or hide shortcut help.
# history_search_previous = "ctrl-r"
# history_search_next = "ctrl-s"
#
[tui.keymap.editor]
